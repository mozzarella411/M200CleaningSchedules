<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家務輪班表</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f2ec;
    --card: #ffffff;
    --text: #1a1a18;
    --muted: #7a7a72;
    --border: #e0ddd5;
    --accent: #d85a30;
    --accent-light: #faece7;
    --green: #1d9e75;
    --green-light: #e1f5ee;
    --blue: #185fa5;
    --blue-light: #e6f1fb;
    --amber: #ba7517;
    --amber-light: #faeeda;
  }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem 4rem;
  }

  .container {
    max-width: 480px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 2rem;
  }

  header h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--text);
  }

  header p {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
  }

  .week-nav {
    display: flex;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 12px;
    margin-bottom: 1.5rem;
    gap: 8px;
  }

  .week-nav button {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 36px;
    height: 36px;
    font-size: 16px;
    cursor: pointer;
    color: var(--text);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .week-nav button:hover { background: var(--border); }

  .week-nav .week-label {
    flex: 1;
    text-align: center;
    font-size: 15px;
    font-weight: 500;
  }

  .today-btn {
    background: var(--accent-light) !important;
    border-color: var(--accent) !important;
    color: var(--accent) !important;
    font-size: 11px !important;
    width: auto !important;
    padding: 0 10px;
    font-weight: 700;
    white-space: nowrap;
    font-family: 'Noto Sans TC', sans-serif;
  }

  .zones-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }

  .zone-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    position: relative;
    overflow: hidden;
  }

  .zone-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }
  .zone-card.bathroom::before { background: var(--blue); }
  .zone-card.kitchen::before { background: var(--accent); }
  .zone-card.floor::before { background: var(--green); }
  .zone-card.trash::before { background: var(--amber); }

  .zone-emoji { font-size: 22px; margin-bottom: 6px; }

  .zone-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }

  .zone-person {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.2;
  }

  .zone-person-2 {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }

  .zone-subtask {
    font-size: 10px;
    color: var(--muted);
    margin-top: 2px;
  }

  .cost-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 500;
    padding: 2px 6px;
    border-radius: 6px;
    margin-top: 8px;
  }
  .bathroom .cost-badge { background: var(--blue-light); color: var(--blue); }
  .kitchen .cost-badge { background: var(--accent-light); color: var(--accent); }
  .floor .cost-badge { background: var(--green-light); color: var(--green); }
  .trash .cost-badge { background: var(--amber-light); color: var(--amber); }

  .tasks-list {
    font-size: 10px;
    color: var(--muted);
    margin-top: 8px;
    line-height: 1.7;
    border-top: 1px solid var(--border);
    padding-top: 8px;
  }

  footer {
    text-align: center;
    margin-top: 2rem;
    font-size: 11px;
    color: var(--muted);
  }

  /* Admin Mode Styles */
  body.admin-mode .admin-only { display: flex !important; }
  body.admin-mode .editable { 
    cursor: pointer; 
    border-bottom: 1px dashed var(--border);
    transition: border-color 0.2s;
  }
  body.admin-mode .editable:hover { 
    border-bottom-color: var(--accent);
  }

  .admin-only { display: none !important; }

  /* Admin Login Button */
  .admin-login-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 44px;
    height: 44px;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    z-index: 100;
  }
  .admin-login-btn:hover {
    background: var(--accent-light);
    border-color: var(--accent);
  }

  /* Settings Button */
  .settings-btn {
    position: fixed;
    bottom: 20px;
    right: 74px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 44px;
    height: 44px;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    z-index: 100;
  }
  .settings-btn:hover {
    background: var(--accent-light);
    border-color: var(--accent);
  }

  /* Logout Button */
  .logout-btn {
    position: fixed;
    bottom: 20px;
    right: 128px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 44px;
    height: 44px;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    z-index: 100;
  }
  .logout-btn:hover {
    background: var(--accent-light);
    border-color: var(--accent);
  }

  /* Modal Overlay */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .modal-overlay.active { display: flex; }

  .modal {
    background: var(--card);
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 420px;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  }

  .modal h2 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
    color: var(--text);
  }

  .modal-close {
    float: right;
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
    color: var(--muted);
    line-height: 1;
  }
  .modal-close:hover { color: var(--text); }

  /* Login Form */
  .form-group {
    margin-bottom: 16px;
  }

  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .form-group input,
  .form-group textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.2s;
  }
  .form-group input:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  .form-error {
    color: var(--accent);
    font-size: 12px;
    margin-top: 8px;
  }

  .btn {
    display: inline-block;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
    font-family: inherit;
  }

  .btn-primary {
    background: var(--accent);
    color: white;
  }
  .btn-primary:hover { background: #c44e28; }

  .btn-secondary {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: var(--border); }

  .btn-full { width: 100%; }

  /* Settings Form */
  .settings-section {
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .settings-section:last-child { border-bottom: none; }

  .settings-section h3 {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 12px;
  }

  .housemate-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .housemate-item {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .housemate-item input {
    flex: 1;
  }

  .btn-icon {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    padding: 0;
  }

  .btn-remove {
    background: var(--accent-light);
    color: var(--accent);
    border: none;
    cursor: pointer;
  }
  .btn-remove:hover { background: var(--accent); color: white; }

  .btn-add {
    background: var(--green-light);
    color: var(--green);
    border: none;
    cursor: pointer;
    margin-top: 8px;
  }
  .btn-add:hover { background: var(--green); color: white; }

  /* Toast Notification */
  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transition: all 0.3s;
    z-index: 2000;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Inline Edit Input */
  .inline-edit-input {
    width: 100%;
    padding: 4px 8px;
    border: 2px solid var(--accent);
    border-radius: 4px;
    font-size: inherit;
    font-family: inherit;
    font-weight: inherit;
    color: inherit;
    background: white;
  }
  .inline-edit-input:focus { outline: none; }

  /* Loading State */
  .loading {
    text-align: center;
    padding: 40px;
    color: var(--muted);
    font-size: 14px;
  }

  /* Zone Edit Controls */
  .zone-edit-controls {
    display: none;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }
  body.admin-mode .zone-edit-controls { display: block; }

  .task-item {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 4px;
  }
  .task-item .task-text { flex: 1; }
  .task-item .btn-remove {
    width: 20px;
    height: 20px;
    font-size: 12px;
    opacity: 0.6;
  }
  .task-item .btn-remove:hover { opacity: 1; }

  /* Info Icon */
  .info-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    font-size: 10px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    user-select: none;
    margin-left: 4px;
    flex-shrink: 0;
    vertical-align: middle;
    background: var(--border);
    color: var(--muted);
    transition: all 0.15s;
  }
  .info-icon:hover { background: var(--muted); color: white; }
  .info-icon.has-desc {
    background: var(--blue-light);
    color: var(--blue);
  }
  .info-icon.has-desc:hover { background: var(--blue); color: white; }
  .info-icon.empty { display: none; }
  body.admin-mode .info-icon.empty {
    display: inline-flex;
    border: 1px dashed var(--accent);
    background: transparent;
    color: var(--accent);
  }
  body.admin-mode .info-icon.empty:hover { background: var(--accent); color: white; }

  .zone-title .info-icon,
  .zone-emoji .info-icon { margin-left: 6px; }
  .zone-subtask .info-icon { vertical-align: middle; }

  /* Tooltip / Popover */
  .tooltip {
    display: none;
    position: fixed;
    z-index: 3000;
    max-width: 260px;
    background: var(--text);
    color: #fff;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 12px;
    line-height: 1.5;
    font-weight: 400;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    pointer-events: none;
    text-align: left;
    white-space: pre-wrap;
  }
  .tooltip.show { display: block; }
  .tooltip::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 20px;
    margin-top: -4px;
    width: 0;
    height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 6px solid var(--text);
  }
  .tooltip .tooltip-edit {
    display: none;
    margin-top: 8px;
  }
  body.admin-mode .tooltip .tooltip-edit { display: block; }
  .tooltip .tooltip-edit textarea {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 6px;
    background: rgba(255,255,255,0.12);
    color: #fff;
    font-size: 12px;
    font-family: inherit;
    resize: vertical;
    min-height: 50px;
  }
  .tooltip .tooltip-edit textarea:focus { outline: none; border-color: #fff; }
  .tooltip .tooltip-actions {
    display: none;
    margin-top: 6px;
    gap: 6px;
  }
  body.admin-mode .tooltip .tooltip-actions { display: flex; }
  .tooltip-btn {
    flex: 1;
    padding: 5px 0;
    border-radius: 6px;
    border: none;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .tooltip-btn-save { background: var(--accent); color: white; }
  .tooltip-btn-save:hover { background: #c44e28; }

  /* Settings description inputs */
  .task-edit-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 6px;
    background: var(--bg);
  }
  .task-edit-row .task-edit-top {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .task-edit-row input[type=text] {
    flex: 1;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
  }
  .task-edit-row .task-edit-desc {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    font-family: inherit;
    color: var(--muted);
  }
  .task-edit-row .task-edit-desc:focus { outline: none; border-color: var(--accent); color: var(--text); }
  .zone-desc-label {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1 id="app-title">🏠 家務輪班表</h1>
    <p id="housemates-display">載入中...</p>
  </header>

  <div class="week-nav">
    <button id="prev">&#8592;</button>
    <span class="week-label" id="week-label"></span>
    <button class="today-btn" id="today-btn">本週</button>
    <button id="next">&#8594;</button>
  </div>

  <div class="zones-grid" id="zones"></div>

  <footer>每週自動更新 · 點「本週」回到當前週次</footer>
</div>

<!-- Admin Login Button -->
<button class="admin-login-btn" id="admin-login-btn" title="管理員登入">👤</button>

<!-- Settings Button (Admin Only) -->
<button class="settings-btn admin-only" id="settings-btn" title="設定">⚙️</button>

<!-- Logout Button (Admin Only) -->
<button class="logout-btn admin-only" id="logout-btn" title="登出">🚪</button>

<!-- Login Modal -->
<div class="modal-overlay" id="login-modal">
  <div class="modal">
    <button class="modal-close" id="login-close">&times;</button>
    <h2>管理員登入</h2>
    <form id="login-form">
      <div class="form-group">
        <label for="login-username">用戶名</label>
        <input type="text" id="login-username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="login-password">密碼</label>
        <input type="password" id="login-password" required autocomplete="current-password">
      </div>
      <p class="form-error" id="login-error"></p>
      <button type="submit" class="btn btn-primary btn-full">登入</button>
    </form>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settings-modal">
  <div class="modal">
    <button class="modal-close" id="settings-close">&times;</button>
    <h2>設定</h2>
    
    <div class="settings-section">
      <h3>🏠 同住人</h3>
      <div class="housemate-list" id="housemate-list"></div>
      <button class="btn btn-add" id="add-housemate">+ 新增同住人</button>
    </div>

    <div class="settings-section">
      <h3>👥 使用者管理</h3>
      <p style="font-size:12px; color:var(--muted); margin-bottom:10px;">建立新帳號供其他同住人登入編輯</p>
      <div class="form-group">
        <label for="register-name">顯示名稱</label>
        <input type="text" id="register-name" placeholder="例: Pudding">
      </div>
      <div class="form-group">
        <label for="register-username">用戶名（登入用）</label>
        <input type="text" id="register-username" autocomplete="username" placeholder="例: pudding">
      </div>
      <div class="form-group">
        <label for="register-password">密碼</label>
        <input type="password" id="register-password" autocomplete="new-password" placeholder="請設定密碼">
      </div>
      <p class="form-error" id="register-error"></p>
      <button class="btn btn-primary btn-full" id="register-btn">建立帳號</button>
      <div class="admin-list" id="admin-list" style="margin-top:12px;"></div>
    </div>

    <div class="settings-section">
      <h3>🚻 廁所</h3>
      <div class="form-group">
        <label>代工費 (€)</label>
        <input type="number" id="zone-bathroom-cost" min="0">
      </div>
      <div class="form-group">
        <label>區域說明</label>
        <input type="text" id="zone-bathroom-desc" placeholder="區域說明（可留空）">
      </div>
      <div class="form-group">
        <label>任務列表</label>
        <div class="task-list" id="tasks-bathroom"></div>
        <button class="btn btn-add" data-zone="bathroom">+ 新增任務</button>
      </div>
    </div>

    <div class="settings-section">
      <h3>🍳 廚房</h3>
      <div class="form-group">
        <label>代工費 (€)</label>
        <input type="number" id="zone-kitchen-cost" min="0">
      </div>
      <div class="form-group">
        <label>區域說明</label>
        <input type="text" id="zone-kitchen-desc" placeholder="區域說明（可留空）">
      </div>
      <div class="form-group">
        <label>任務列表</label>
        <div class="task-list" id="tasks-kitchen"></div>
        <button class="btn btn-add" data-zone="kitchen">+ 新增任務</button>
      </div>
    </div>

    <div class="settings-section">
      <h3>🧹 地板</h3>
      <div class="form-group">
        <label>代工費 (€)</label>
        <input type="number" id="zone-floor-cost" min="0">
      </div>
      <div class="form-group">
        <label>區域說明</label>
        <input type="text" id="zone-floor-desc" placeholder="區域說明（可留空）">
      </div>
      <div class="form-group">
        <label>任務列表</label>
        <div class="task-list" id="tasks-floor"></div>
        <button class="btn btn-add" data-zone="floor">+ 新增任務</button>
      </div>
    </div>

    <div class="settings-section">
      <h3>🗑️ 垃圾</h3>
      <div class="form-group">
        <label>代工費 (€)</label>
        <input type="number" id="zone-trash-cost" min="0">
      </div>
      <div class="form-group">
        <label>區域說明</label>
        <input type="text" id="zone-trash-desc" placeholder="區域說明（可留空）">
      </div>
      <div class="form-group">
        <label>任務列表</label>
        <div class="task-list" id="tasks-trash"></div>
        <button class="btn btn-add" data-zone="trash">+ 新增任務</button>
      </div>
    </div>

    <div class="settings-section">
      <h3>📅 輪班設定</h3>
      <div class="form-group">
        <label>起始日期</label>
        <input type="date" id="anchor-date">
      </div>
    </div>

    <button class="btn btn-primary btn-full" id="save-settings">儲存設定</button>
    <p class="form-error" id="settings-error"></p>
  </div>
</div>

<!-- Toast Notification -->
<div class="toast" id="toast">已儲存</div>

  // ============================================

  // SHA-256 hash for password
  async function hashPassword(password) {
    const encoder = new TextEncoder();
    const data = encoder.encode(password);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(hashBuffer))
      .map(b => b.toString(16).padStart(2, '0')).join('');
  }

  // Show toast notification
  function showToast(message = '已儲存') {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }

  // Format date
  function fmt(d) {
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return m + '/' + day;
  }

  // Get week offset from anchor
  function getWeekOffset(date) {
    const anchor = new Date(appConfig.anchorDate + 'T00:00:00');
    const ms = date - anchor;
    return Math.floor(ms / (7 * 86400000));
  }

  // Get week start date
  function getWeekStart(offset) {
    const anchor = new Date(appConfig.anchorDate + 'T00:00:00');
    const d = new Date(anchor);
    d.setDate(d.getDate() + offset * 7);
    return d;
  }

  // Normalize a task entry (string or object) to { text, description }
  function normalizeTask(t) {
    if (typeof t === 'string') {
      return { text: t, description: '' };
    }
    if (t && typeof t === 'object') {
      return { text: t.text || '', description: t.description || '' };
    }
    return { text: String(t || ''), description: '' };
  }

  // Build info icon HTML for a description
  function escHtml(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function infoIconHtml(description, zone, taskIndex) {
    const hasDesc = !!(description && description.trim());
    const cls = hasDesc ? 'info-icon has-desc' : 'info-icon empty';
    const idx = (taskIndex === undefined || taskIndex === null) ? '' : taskIndex;
    return `<span class="${cls}" data-zone="${escHtml(zone)}" data-index="${idx}">i</span>`;
  }

  // ============================================
  // ADMIN AUTHENTICATION
  // ============================================
  
  async function adminLogin(username, password) {
    try {
      const docRef = doc(db, 'credentials', 'admins');
      const docSnap = await getDoc(docRef);

      if (!docSnap.exists()) {
        return { success: false, error: '未配置管理員帳號' };
      }

      const admins = docSnap.data().admins;
      const admin = admins[username.toLowerCase()];

      if (!admin) {
        return { success: false, error: '未知的用戶名' };
      }

      const passwordHash = await hashPassword(password);

      if (passwordHash === admin.passwordHash) {
        sessionStorage.setItem('admin', JSON.stringify({
          displayName: admin.displayName,
          time: Date.now()
        }));
        return { success: true, displayName: admin.displayName };
      }

      return { success: false, error: '密碼錯誤' };
    } catch (error) {
      return { success: false, error: '登入失敗：' + error.message };
    }
  }

  function checkAdminSession() {
    const stored = sessionStorage.getItem('admin');
    if (!stored) return false;
    const admin = JSON.parse(stored);
    // Auto-expire after 24 hours
    if (Date.now() - admin.time > 24 * 60 * 60 * 1000) {
      sessionStorage.removeItem('admin');
      return false;
    }
    return true;
  }

  function setAdminMode(active) {
    isAdmin = active;
    document.body.classList.toggle('admin-mode', active);
  }

  function adminLogout() {
    sessionStorage.removeItem('admin');
    setAdminMode(false);
    showToast('已登出');
  }

  // ============================================
  // RENDERING
  // ============================================
  
  function renderSchedule() {
    if (!appConfig) return;

    // Update title
    document.getElementById('app-title').textContent = appConfig.settings?.title || '🏠 家務輪班表';

    // Update housemates display
    document.getElementById('housemates-display').textContent = appConfig.housemates.join(' · ');

    // Update week label
    const weekStart = getWeekStart(currentOffset);
    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekEnd.getDate() + 6);
    document.getElementById('week-label').textContent = fmt(weekStart) + ' – ' + fmt(weekEnd);

    // Calculate rotation index
    const idx = ((currentOffset % 4) + 4) % 4;

    const zones = appConfig.zones;
    let html = '';

    // Bathroom
    const bathroomPerson = appConfig.housemates[zones.bathroom.rotation[idx]];
    let bathroomTasks = (zones.bathroom.tasks || []).map(normalizeTask).map((t, i) =>

    ).join('');
    html += `
      <div class="zone-card bathroom">
        <div class="zone-emoji">${zones.bathroom.emoji}</div>
        <div class="zone-title">${zones.bathroom.name} ${infoIconHtml(zones.bathroom.description || '', 'bathroom')}</div>

    ).join('');
    html += `
      <div class="zone-card kitchen">
        <div class="zone-emoji">${zones.kitchen.emoji}</div>
        <div class="zone-title">${zones.kitchen.name} ${infoIconHtml(zones.kitchen.description || '', 'kitchen')}</div>
        <div class="cost-badge">代工費 €${zones.kitchen.cost}</div>
        <div class="zone-person editable" data-type="person" data-zone="kitchen" data-index="${idx}">${kitchenPerson}</div>
        <div class="tasks-list">${kitchenTasks}</div>
        <div class="zone-edit-controls">
          <button class="btn btn-secondary btn-full" onclick="editZoneTasks('kitchen')">編輯任務</button>
        </div>
      </div>
    `;

    // Floor
    const floorPerson = appConfig.housemates[zones.floor.rotation[idx]];
    let floorTasks = (zones.floor.tasks || []).map(normalizeTask).map((t, i) =>
      `<div class="task-item"><span class="task-text">${t.text}</span>${infoIconHtml(t.description, 'floor', i)}</div>`
    ).join('');
    html += `
      <div class="zone-card floor">
        <div class="zone-emoji">${zones.floor.emoji}</div>
        <div class="zone-title">${zones.floor.name} ${infoIconHtml(zones.floor.description || '', 'floor')}</div>
        <div class="cost-badge">代工費 €${zones.floor.cost}</div>
        <div class="zone-person editable" data-type="person" data-zone="floor" data-index="${idx}">${floorPerson}</div>
        <div class="tasks-list">${floorTasks}</div>
        <div class="zone-edit-controls">
          <button class="btn btn-secondary btn-full" onclick="editZoneTasks('floor')">編輯任務</button>
        </div>
      </div>
    `;

    // Trash
    const trashPerson = appConfig.housemates[zones.trash.rotation[idx]];
    let trashTasks = (zones.trash.tasks || []).map(normalizeTask).map((t, i) =>
      `<div class="task-item"><span class="task-text">${t.text}</span>${infoIconHtml(t.description, 'trash', i)}</div>`
    ).join('');
    html += `
      <div class="zone-card trash">

        <div class="zone-title">${zones.trash.name} ${infoIconHtml(zones.trash.description || '', 'trash')}</div>
        <div class="cost-badge">代工費 €${zones.trash.cost}</div>
        <div class="zone-person editable" data-type="person" data-zone="trash" data-index="${idx}">${trashPerson}</div>

    document.getElementById('zones').innerHTML = html;

  // ============================================
  // INLINE EDITING
  // ============================================
  
  function attachInlineEditListeners() {
    document.querySelectorAll('.editable').forEach(el => {
      el.addEventListener('click', handleInlineEdit);
    });
  }

  function handleInlineEdit(e) {
    if (!isAdmin) return;
    
    const el = e.target;
    const type = el.dataset.type;
    const zone = el.dataset.zone;
    const index = parseInt(el.dataset.index);
    
    if (type === 'person') {
      startPersonEdit(el, zone, index);
    }
  }

  function startPersonEdit(el, zone, index) {
    const currentValue = el.textContent.trim();
    const input = document.createElement('input');
    input.type = 'text';
    input.value = currentValue;
    input.className = 'inline-edit-input';
    
    el.textContent = '';
    el.appendChild(input);
    input.focus();
    input.select();
    
    const save = async () => {
      const newValue = input.value.trim();
      if (newValue && newValue !== currentValue) {
        await updatePersonAssignment(zone, index, newValue);
        showToast('已更新');
      }
      renderSchedule();
    };
    
    input.addEventListener('blur', save);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') save();
      if (e.key === 'Escape') renderSchedule();
    });
  }

  async function updatePersonAssignment(zone, index, newName) {
    // Check if person exists, if not add them
    if (!appConfig.housemates.includes(newName)) {
      appConfig.housemates.push(newName);
    }
    
    const personIndex = appConfig.housemates.indexOf(newName);
    appConfig.zones[zone].rotation[index] = personIndex;
    
    await saveConfig();
  }

  // Make editZoneTasks available globally
  window.editZoneTasks = function(zoneId) {
    if (!isAdmin) return;
    // This would open a more detailed editor - simplified for now
    showToast('請使用設定面板編輯任務');
  };

  // ============================================
  // TOOLTIP / INFO ICONS
  // ============================================

  let tooltipTarget = null; // { zone, index }

  function attachInfoIcons() {
    document.querySelectorAll('.info-icon').forEach(icon => {
      icon.addEventListener('click', (e) => {
        e.stopPropagation();
        handleInfoIconClick(icon);
      });
    });
  }

  function handleInfoIconClick(icon) {
    const zone = icon.dataset.zone;
    const index = icon.dataset.index ? parseInt(icon.dataset.index) : null;

    // Toggle: if the same target's tooltip is already open, close it
    if (tooltipTarget && tooltipTarget.zone === zone && tooltipTarget.index === index) {
      hideTooltip();
      return;
    }

    let description = '';

    if (index === null) {
      description = appConfig.zones[zone].description || '';
    } else {
      const task = normalizeTask(appConfig.zones[zone].tasks[index]);
      description = task.description;
    }

    showTooltip(icon, description, zone, index);
  }

  function showTooltip(anchor, text, zone, index) {
    const tooltip = document.getElementById('tooltip');
    const textEl = document.getElementById('tooltip-text');
    const saveBtn = document.getElementById('tooltip-save');

    tooltipTarget = { zone, index };

    textEl.textContent = text || '（尚無說明）點擊編輯';
    document.getElementById('tooltip-textarea').value = text || '';

    // Position
    const rect = anchor.getBoundingClientRect();
    tooltip.style.left = Math.min(rect.left + rect.width / 2 - 130, window.innerWidth - 280) + 'px';
    tooltip.style.top = (rect.bottom + 8) + 'px';

    tooltip.classList.add('show');

    saveBtn.onclick = async () => {
      const newDesc = document.getElementById('tooltip-textarea').value;
      if (tooltipTarget) {
        await saveDescription(tooltipTarget.zone, tooltipTarget.index, newDesc);
      }
      hideTooltip();
      showToast('已更新');
      renderSchedule();
    };
  }

  function hideTooltip() {
    document.getElementById('tooltip').classList.remove('show');
    tooltipTarget = null;
  }

  async function saveDescription(zone, index, newDesc) {
    if (!appConfig.zones[zone]) return;
    if (index === null) {
      appConfig.zones[zone].description = newDesc;
    } else {
      const tasks = appConfig.zones[zone].tasks || [];
      const task = normalizeTask(tasks[index]);
      tasks[index] = { text: task.text, description: newDesc };
      appConfig.zones[zone].tasks = tasks;
    }
    await saveConfig();
  }

  // Close tooltip when clicking elsewhere
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.info-icon') && !e.target.closest('#tooltip')) {
      hideTooltip();
    }
  });

  // ============================================
  // SETTINGS MODAL
  // ============================================
  
  function openSettings() {
    if (!appConfig) return;
    
    // Populate housemate list
    const housemateList = document.getElementById('housemate-list');
    housemateList.innerHTML = appConfig.housemates.map((name, i) => `
      <div class="housemate-item">
        <input type="text" value="${name}" data-index="${i}" class="housemate-input">
        <button class="btn-icon btn-remove" data-index="${i}">&times;</button>
      </div>
    `).join('');
    
    // Attach remove listeners
    housemateList.querySelectorAll('.btn-remove').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const index = parseInt(e.target.dataset.index);
        appConfig.housemates.splice(index, 1);
        openSettings(); // Refresh
      });
    });
    
    // Populate zone costs
    document.getElementById('zone-bathroom-cost').value = appConfig.zones.bathroom.cost;
    document.getElementById('zone-kitchen-cost').value = appConfig.zones.kitchen.cost;
    document.getElementById('zone-floor-cost').value = appConfig.zones.floor.cost;
    document.getElementById('zone-trash-cost').value = appConfig.zones.trash.cost;

    // Populate zone descriptions
    document.getElementById('zone-bathroom-desc').value = appConfig.zones.bathroom.description || '';
    document.getElementById('zone-kitchen-desc').value = appConfig.zones.kitchen.description || '';
    document.getElementById('zone-floor-desc').value = appConfig.zones.floor.description || '';
    document.getElementById('zone-trash-desc').value = appConfig.zones.trash.description || '';
    
    // Populate tasks
    populateTaskList('bathroom', appConfig.zones.bathroom.tasks);
    populateTaskList('kitchen', appConfig.zones.kitchen.tasks);
    populateTaskList('floor', appConfig.zones.floor.tasks);
    populateTaskList('trash', appConfig.zones.trash.tasks);
    
    // Populate anchor date
    document.getElementById('anchor-date').value = appConfig.anchorDate;

    // Clear user-creation form error and refresh admin list
    document.getElementById('register-error').textContent = '';
    refreshAdminList();
    
    document.getElementById('settings-modal').classList.add('active');
  }

  function populateTaskList(zoneId, tasks) {
    const container = document.getElementById(`tasks-${zoneId}`);
    container.innerHTML = (tasks || []).map((task, i) => {
      const t = normalizeTask(task);
      return `
        <div class="task-edit-row">
          <div class="task-edit-top">
            <input type="text" class="task-text-input" value="${t.text.replace(/"/g, '&quot;')}" data-zone="${zoneId}" data-index="${i}">
            <button class="btn-icon btn-remove" data-zone="${zoneId}" data-index="${i}">&times;</button>
          </div>
          <input type="text" class="task-desc-input" placeholder="任務說明（可留空）" value="${(t.description||'').replace(/"/g, '&quot;')}" data-zone="${zoneId}" data-index="${i}">
        </div>
      `;
    }).join('');
    
    container.querySelectorAll('.btn-remove').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const zone = e.target.dataset.zone;
        const index = parseInt(e.target.dataset.index);
        appConfig.zones[zone].tasks.splice(index, 1);
        populateTaskList(zone, appConfig.zones[zone].tasks);
      });
    });
  }

  async function saveSettings() {
    try {
      // Update housemates
      const housemateInputs = document.querySelectorAll('.housemate-input');
      appConfig.housemates = Array.from(housemateInputs).map(input => input.value.trim()).filter(v => v);
      
      // Update zone costs
      appConfig.zones.bathroom.cost = parseInt(document.getElementById('zone-bathroom-cost').value) || 0;
      appConfig.zones.kitchen.cost = parseInt(document.getElementById('zone-kitchen-cost').value) || 0;
      appConfig.zones.floor.cost = parseInt(document.getElementById('zone-floor-cost').value) || 0;
      appConfig.zones.trash.cost = parseInt(document.getElementById('zone-trash-cost').value) || 0;

      // Update zone descriptions
      appConfig.zones.bathroom.description = document.getElementById('zone-bathroom-desc').value.trim();
      appConfig.zones.kitchen.description = document.getElementById('zone-kitchen-desc').value.trim();
      appConfig.zones.floor.description = document.getElementById('zone-floor-desc').value.trim();
      appConfig.zones.trash.description = document.getElementById('zone-trash-desc').value.trim();
      
      // Update tasks (read text + description inputs, normalize to objects)
      ['bathroom', 'kitchen', 'floor', 'trash'].forEach(zoneId => {
        const rows = Array.from(document.querySelectorAll(`#tasks-${zoneId} .task-edit-row`));
        appConfig.zones[zoneId].tasks = rows.map(row => {
          const text = row.querySelector('.task-text-input').value.trim();
          const description = row.querySelector('.task-desc-input').value.trim();
          return { text, description };
        }).filter(t => t.text);
      });
      
      // Update anchor date
      appConfig.anchorDate = document.getElementById('anchor-date').value;
      
      await saveConfig();
      
      document.getElementById('settings-modal').classList.remove('active');
      showToast('設定已儲存');
      renderSchedule();
    } catch (error) {
      document.getElementById('settings-error').textContent = '儲存失敗：' + error.message;
    }
  }

  // ============================================
  // FIREBASE OPERATIONS
  // ============================================
  
  async function saveConfig() {
    const docRef = doc(db, 'config', 'app');
    await updateDoc(docRef, {
      ...appConfig,
      lastUpdated: serverTimestamp()
    });
  }

  async function initializeDefaultConfig() {
    const docRef = doc(db, 'config', 'app');
    await setDoc(docRef, {
      ...defaultConfig,
      lastUpdated: serverTimestamp()
    });
  }

  // ============================================
  // EVENT LISTENERS
  // ============================================
  
  // Week navigation
  document.getElementById('prev').addEventListener('click', () => {
    currentOffset--;
    renderSchedule();
  });

  document.getElementById('next').addEventListener('click', () => {
    currentOffset++;
    renderSchedule();
  });

  document.getElementById('today-btn').addEventListener('click', () => {
    currentOffset = getWeekOffset(new Date());
    renderSchedule();
  });

  // Admin login
  document.getElementById('admin-login-btn').addEventListener('click', () => {
    document.getElementById('login-modal').classList.add('active');
  });

  document.getElementById('login-close').addEventListener('click', () => {
    document.getElementById('login-modal').classList.remove('active');
    document.getElementById('login-error').textContent = '';
  });

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('login-username').value;
    const password = document.getElementById('login-password').value;
    
    const result = await adminLogin(username, password);
    
    if (result.success) {
      document.getElementById('login-modal').classList.remove('active');
      document.getElementById('login-error').textContent = '';
      setAdminMode(true);
      showToast(`歡迎，${result.displayName}！`);
    } else {
      document.getElementById('login-error').textContent = result.error;
    }
  });

  // Logout
  document.getElementById('logout-btn').addEventListener('click', () => {
    adminLogout();
  });

  // ============================================
  // USER MANAGEMENT (admin only)
  // ============================================

  let adminListData = null;

  async function refreshAdminList() {
    const container = document.getElementById('admin-list');
    if (!container) return;
    try {
      const adminsRef = doc(db, 'credentials', 'admins');
      const snap = await getDoc(adminsRef);
      adminListData = snap.exists() ? (snap.data().admins || {}) : {};
      const entries = Object.entries(adminListData);
      container.innerHTML = entries.length
        ? '<p style="font-size:11px; color:var(--muted); margin-bottom:6px;">現有帳號：</p>' +
          entries.map(([u, a]) => '<div style="font-size:12px; color:var(--text); padding:2px 0;">' +
            '<span style="display:inline-block; border:1px solid var(--border); border-radius:6px; padding:2px 8px;">' + (a.displayName || u) + '（' + u + '）</span></div>').join('')
        : '<p style="font-size:12px; color:var(--muted);">尚無帳號，請使用上面表單建立。</p>';
    } catch (err) {
      container.innerHTML = '<p style="font-size:12px; color:var(--accent);">載入帳號失敗：' + err.message + '</p>';
    }
  }

  // Create user (only reachable from settings, which is admin-only)
  document.getElementById('register-btn').addEventListener('click', async () => {
    const displayName = document.getElementById('register-name').value.trim();
    const username = document.getElementById('register-username').value.trim().toLowerCase();
    const password = document.getElementById('register-password').value;
    const errEl = document.getElementById('register-error');

    if (!displayName || !username || !password) {
      errEl.textContent = '請填寫所有欄位';
      return;
    }

    try {
      const adminsRef = doc(db, 'credentials', 'admins');
      const snap = await getDoc(adminsRef);
      if (snap.exists() && snap.data().admins[username]) {
        errEl.textContent = '此用戶名已被使用';
        return;
      }

      const passwordHash = await hashPassword(password);
      const existingAdmins = snap.exists() ? snap.data().admins : {};
      await updateDoc(adminsRef, {
        admins: {
          ...existingAdmins,
          [username]: { displayName, passwordHash, role: 'admin' }
        }
      });

      errEl.textContent = '';
      document.getElementById('register-name').value = '';
      document.getElementById('register-username').value = '';
      document.getElementById('register-password').value = '';
      showToast(`帳號 ${displayName} 建立成功`);
      refreshAdminList();
    } catch (error) {
      errEl.textContent = '建立失敗：' + error.message;
    }
  });

  // Settings
  document.getElementById('settings-btn').addEventListener('click', openSettings);
  document.getElementById('settings-close').addEventListener('click', () => {
    document.getElementById('settings-modal').classList.remove('active');
  });
  document.getElementById('save-settings').addEventListener('click', saveSettings);

  // Add housemate
  document.getElementById('add-housemate').addEventListener('click', () => {
    appConfig.housemates.push('');
    openSettings();
    // Focus on the new input
    const inputs = document.querySelectorAll('.housemate-input');
    inputs[inputs.length - 1].focus();
  });

  // Add task buttons
  document.querySelectorAll('.btn-add[data-zone]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const zone = e.target.dataset.zone;
      const taskName = prompt('輸入任務名稱：');
      if (taskName && taskName.trim()) {
        if (!appConfig.zones[zone].tasks) appConfig.zones[zone].tasks = [];
        appConfig.zones[zone].tasks.push({ text: taskName.trim(), description: '' });
        populateTaskList(zone, appConfig.zones[zone].tasks);
      }
    });
  });

  // Close modals on overlay click
  document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) {
        overlay.classList.remove('active');
      }
    });
  });

  // ============================================
  // INITIALIZATION
  // ============================================
  
  // Check for existing admin session
  if (checkAdminSession()) {
    setAdminMode(true);
  }

  // Listen for real-time updates from Firestore
  const unsub = onSnapshot(doc(db, 'config', 'app'), (docSnap) => {
    if (docSnap.exists()) {
      appConfig = docSnap.data();
    } else {
      appConfig = defaultConfig;
      initializeDefaultConfig();
    }
    currentOffset = getWeekOffset(new Date());
    renderSchedule();
  }, (error) => {
    console.error('Firestore error:', error);
    appConfig = defaultConfig;
    currentOffset = getWeekOffset(new Date());
    renderSchedule();
  });
</script>
</body>
</html>
